name: Crawler Image

# ECS(Fargate ARM64) 일일 크롤링 이미지.
# - PR: 이미지 구성(Dockerfile·의존성·docker/·ecs/)이 바뀔 때만 ARM 러너에서 빌드·스모크(푸시 없음).
#   코드만 바뀐 PR 은 pytest 로 충분하다(main 머지 때 빌드·스모크를 다시 하므로 깨진 이미지는 배포되지 않는다).
# - Actions 사용 시간을 줄이려고 문서·테스트만 바뀐 main push 는 빌드하지 않는다.
# - main push: 빌드·스모크 → ECR 푸시 → 태스크 정의 새 개정 등록 → 예약(EventBridge Scheduler) 대상 교체.
#   AWS 쪽 준비(vars.AWS_CRAWLER_ROLE_ARN·AWS_ACCOUNT_ID)가 없으면 푸시 이후 단계는 건너뛴다.
# 공개 저장소라 계정 번호·역할은 저장소 변수로만 주입한다.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - docker/**
      - ecs/**
      - .github/workflows/crawler-image.yml
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - tests/**
      - requirements-dev.txt
      - .github/workflows/pr-test-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: roeum-crawler
  SCHEDULE_NAME: roeum-crawler-daily

jobs:
  build:
    name: build-smoke-deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: roeum-crawler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm --entrypoint python3 roeum-crawler:${{ github.sha }} docker/smoke_test.py

      - name: Check AWS deploy settings
        id: aws
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ROLE: ${{ vars.AWS_CRAWLER_ROLE_ARN }}
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "AWS 배포 변수가 없어 푸시·배포를 건너뜁니다."; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure AWS credentials
        if: steps.aws.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CRAWLER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        id: push
        if: steps.aws.outputs.enabled == 'true'
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker tag "roeum-crawler:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register task definition and point the schedule at it
        if: steps.aws.outputs.enabled == 'true'
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          sed -e "s|__AWS_ACCOUNT_ID__|$ACCOUNT|g" -e "s|__IMAGE__|$IMAGE|g" ecs/task-definition.json > /tmp/taskdef.json
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $TASK_DEF_ARN"
          # 예약의 다른 설정(시각·상태·네트워크)은 그대로 두고 태스크 정의만 바꾼다. 꺼진 예약은 꺼진 채로 남는다.
          aws scheduler get-schedule --name "$SCHEDULE_NAME" > /tmp/schedule.json
          # update-schedule 은 전체를 덮어쓰므로 읽기 전용 필드만 빼고 나머지(KMS·시작/종료일 등)는 그대로 넘긴다.
          jq --arg td "$TASK_DEF_ARN" \
            'del(.Arn, .CreationDate, .LastModificationDate) | .Target.EcsParameters.TaskDefinitionArn = $td' \
            /tmp/schedule.json > /tmp/schedule-update.json
          aws scheduler update-schedule --cli-input-json file:///tmp/schedule-update.json
          echo "schedule $SCHEDULE_NAME → $TASK_DEF_ARN"

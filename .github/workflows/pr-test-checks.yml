name: PR Test Checks

# 문서만 바뀐 PR 은 돌리지 않는다(Actions 사용 시간 절약). 필수 검사로 걸려 있지 않아 건너뛰어도 머지할 수 있다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - docs/**
      - .github/workflows/crawler-image.yml

permissions:
  contents: read

concurrency:
  group: crawler-pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

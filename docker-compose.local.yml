# 크롤러 로컬 테스트용 Mongo — 적재 경로(JSONL → Mongo)를 로컬에서 검증한다. Atlas 무영향.
services:
  mongo-local:
    image: mongo:7.0
    container_name: roeum-crawler-mongo-local
    ports:
      - "27017:27017"
    volumes:
      - ./mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
